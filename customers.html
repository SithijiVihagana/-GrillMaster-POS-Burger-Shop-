<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers - GrillMaster POS</title>
    <link rel="stylesheet" href="assets/css/customer.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-top shadow-sm">
        <div class="container d-flex justify-content-between">
            <a class="navbar-brand" href="index.html">
                GrillMaster POS
            </a>
            <a class="btn btn-outline-dark rounded-pill px-4 btn-back-pos" href="index.html">
                Back to POS
            </a>
        </div>
    </nav>

    <div class="container mt-4">

        <h2 class="page-title">Customers</h2>

       
        <div class="dark-card p-4 mb-5">
            <form id="customerForm" class="row g-3 g-md-4 align-items-end">
                <input type="hidden" id="cust_id">

                <div class="col-12 col-md-5">
                    <label for="cust_name" class="form-label">Name</label>
                    <input id="cust_name" class="form-control" required placeholder="Enter customer name">
                </div>

                <div class="col-12 col-md-4">
                    <label for="cust_phone" class="form-label">Phone</label>
                    <input id="cust_phone" class="form-control" type="tel" placeholder="Enter phone number">
                </div>

                
                <div class="col-12 col-md-3">
                    <button class="btn btn-warning w-100 save-btn" type="submit">
                        Save Customer
                    </button>
                </div>
            </form>
        </div>

        
        <h3 class="text-secondary mb-3">Customer Directory</h3>
        <div id="customersTable" class="customer-list">
           
        </div>
    </div>



    <script src="assets/js/storage.js"></script>
    <script src="assets/js/customers.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
