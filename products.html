<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - GrillMaster POS</title>
    <link rel="stylesheet" href="assets/css/product.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-top shadow-sm">
        <div class="container d-flex justify-content-between">
            <a class="navbar-brand" href="index.html">
                GrillMaster POS
            </a>
            <a class="btn btn-outline-dark rounded-pill px-4 btn-back-pos" href="index.html">
                Back to POS
            </a>
        </div>
    </nav>

    <div class="container mt-4">

        <h2 class="page-title">Products</h2>
        <div class="product_card p-4 mb-5">
            <div class="card-body">
                <form id="productForm" class="row g-2 align-items-end">
                    <input type="hidden" id="prod_id">

                    <div class="col-md-3">
                        <label class="form-label">Name</label>
                        <input id="prod_name" class="form-control" required>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Price (LKR)</label>
                        <input id="prod_price" type="number" step="0.01" class="form-control" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Category</label>
                        <select id="prod_cat" class="form-select">
                            <option>Burger</option>
                            <option>Fries</option>
                            <option>Drink</option>
                            <option>Dessert</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Image</label>
                        <input id="prod_img" type="file" accept="image/*" class="form-control">
                    </div>

                    <div class="col-md-1 text-end">
                        <button class="btn btn-warning w-100" type="submit">Save</button>
                    </div>

                </form>
            </div>
        </div>

        <div id="productsTable" class="row row-cols-1 row-cols-md-2 g-3"></div>
    </div>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/products.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
